<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="100%" height="100%">
  <style>
    :root {
      --falcon-primary: currentColor;
      --falcon-eye: #00e5ff;
      --falcon-sub: #64748b;
    }
    .falcon-primary-elem {
      fill: var(--falcon-primary, currentColor);
    }
    .falcon-eye-elem {
      fill: var(--falcon-eye, #00e5ff);
    }
    .falcon-eye-ring-elem {
      stroke: var(--falcon-eye, #00e5ff);
      stroke-width: 1.8;
      stroke-dasharray: 9 3;
      fill: none;
    }
    .falcon-sub-elem {
      fill: var(--falcon-sub, #64748b);
    }
  </style>

  <!-- Transparent Background Adaptive Horizontal Lockup -->
  <!-- Falcon Icon Group -->
  <g transform="translate(8, 8)">
    <path class="falcon-primary-elem" d="
      M 6 24
      L 13 17
      L 24 10
      L 37 10
      L 29 17
      L 41 17
      L 32 25
      L 41 25
      L 27 39
      L 24 33
      L 18 33
      L 10 27
      L 14 24
      Z" />

    <path class="falcon-primary-elem" opacity="0.9" d="
      M 6 24
      L 12 25
      L 9 29
      L 6 25
      Z" />

    <!-- Ocular Eye Aperture -->
    <g transform="translate(21, 21.5)">
      <circle cx="0" cy="0" r="6.2" class="falcon-eye-ring-elem" />
      <circle cx="0" cy="0" r="3.2" class="falcon-eye-elem" />
      <circle cx="1" cy="-1" r="0.9" fill="#ffffff" />
    </g>
  </g>

  <!-- Typography: FALCON EYE Wordmark -->
  <g transform="translate(68, 34)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4.5" class="falcon-primary-elem">
      FALCON<tspan class="falcon-eye-elem"> </tspan><tspan font-weight="300">EYE</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(69, 48)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2.8" class="falcon-sub-elem">
      AUTOMATED RISK INTELLIGENCE
    </text>
  </g>
</svg>
