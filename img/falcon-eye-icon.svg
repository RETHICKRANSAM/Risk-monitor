<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <filter id="eyePulse" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="var(--falcon-eye, #00e5ff)" flood-opacity="0.6"/>
    </filter>
  </defs>
  <style>
    :root {
      --falcon-primary: currentColor;
      --falcon-eye: #00e5ff;
    }
    .falcon-silhouette {
      fill: var(--falcon-primary, currentColor);
    }
    .falcon-eye-ring {
      stroke: var(--falcon-eye, #00e5ff);
      stroke-width: 1.6;
      stroke-dasharray: 8 3;
      fill: none;
    }
    .falcon-eye-pupil {
      fill: var(--falcon-eye, #00e5ff);
      filter: url(#eyePulse);
    }
    .falcon-eye-glint {
      fill: #ffffff;
    }
  </style>

  <!-- Aerodynamic Falcon Head Silhouette (Vector Construction) -->
  <g class="falcon-mark" transform="translate(1, 1)">
    <!-- Main Crest, Beak and Wing Feathers -->
    <path class="falcon-silhouette" d="
      M 6 24
      L 13 17
      L 24 10
      L 37 10
      L 29 17
      L 41 17
      L 32 25
      L 41 25
      L 27 39
      L 24 33
      L 18 33
      L 10 27
      L 14 24
      Z" 
      fill-rule="evenodd" />

    <!-- Sharp Under-Beak Hook -->
    <path class="falcon-silhouette" d="
      M 6 24
      L 12 25
      L 9 29
      L 6 25
      Z" />

    <!-- Intelligent Radar Aperture Eye (Vigilance & Monitoring) -->
    <g class="falcon-eye-group" transform="translate(21, 21.5)">
      <!-- Outer Aperture Radar Arc -->
      <circle cx="0" cy="0" r="6" class="falcon-eye-ring" />
      <!-- Central Focus Core / Pupil -->
      <circle cx="0" cy="0" r="3.2" class="falcon-eye-pupil" />
      <!-- Specular High-Precision Highlight -->
      <circle cx="1" cy="-1" r="0.9" class="falcon-eye-glint" />
    </g>
  </g>
</svg>
