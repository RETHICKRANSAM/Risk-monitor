<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login — Enterprise SOC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #0F1115;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
  
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="w-full max-w-md p-8 bg-[#1C1F26]/80 backdrop-blur-xl border border-[#2A2E37] rounded-2xl shadow-2xl relative z-10">
    
    <div class="flex flex-col items-center mb-8">
      <img src="/static/logo.png" alt="Falcon Eye" class="max-h-28 w-auto mb-2 object-contain" style="filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.3));">
      <p class="text-[#94A3B8] text-sm mt-1">Enterprise Security Operations</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-[#94A3B8] mb-1">Email Address</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#94A3B8] text-[20px]">person</span>
          <input type="email" id="email" value="analyst@socprime.local" required class="w-full bg-[#0F1115] border border-[#2A2E37] rounded-lg pl-10 pr-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#94A3B8] mb-1">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#94A3B8] text-[20px]">lock</span>
          <input type="password" id="password" value="password123" required class="w-full bg-[#0F1115] border border-[#2A2E37] rounded-lg pl-10 pr-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center">
          <input type="checkbox" class="rounded border-[#2A2E37] bg-[#0F1115] text-indigo-500 focus:ring-indigo-500/50 cursor-pointer w-4 h-4">
          <span class="ml-2 text-sm text-[#94A3B8]">Remember me</span>
        </label>
        <a href="#" class="text-sm text-indigo-400 hover:text-indigo-300">Forgot password?</a>
      </div>

      <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-2.5 rounded-lg transition-colors shadow-[0_0_15px_rgba(99,102,241,0.4)] flex items-center justify-center">
        Sign In
      </button>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      // For demo, just redirect to dashboard
      window.location.href = '/dashboard';
    }
  </script>
</body>
</html>
