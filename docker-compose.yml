services:
  risk-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risk-monitor-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///instance/local_fallback.db}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - app_data:/app/data
      - app_instance:/app/instance
    restart: unless-stopped

volumes:
  app_data:
  app_instance:
