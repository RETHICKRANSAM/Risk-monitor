<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Audit History — Complete audit trail of all deployment decisions across organizations.">
    <title>Audit History — Pre-Release Risk Monitor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>

    <div class="app-layout">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">🛡️</div>
                <h2>Risk Monitor</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link" id="nav-dashboard">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a href="audit.html" class="nav-link active" id="nav-audit">
                    <span class="nav-icon">📋</span> Audit History
                </a>
            </nav>
            <div class="sidebar-user">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">?</div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Loading...</div>
                        <div class="user-role" id="userRole">—</div>
                    </div>
                </div>
                <button class="btn btn-outline btn-sm" style="width: 100%;" id="logoutBtn">Sign Out</button>
            </div>
        </aside>

        <main class="main-content">

            <div class="page-header">
                <div>
                    <h1>Audit History</h1>
                    <p class="subtitle">Complete record of all deployment decisions</p>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-bar">
                <div>
                    <label class="form-label">From Date</label>
                    <input type="date" class="form-input" id="filterFrom">
                </div>
                <div>
                    <label class="form-label">To Date</label>
                    <input type="date" class="form-input" id="filterTo">
                </div>
                <div>
                    <label class="form-label">Decision</label>
                    <select class="form-select" id="filterDecision">
                        <option value="">All</option>
                        <option value="ALLOW">Allow</option>
                        <option value="PAUSE">Pause</option>
                        <option value="BLOCK">Block</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Organization</label>
                    <select class="form-select" id="filterOrg">
                        <option value="">All</option>
                    </select>
                </div>
                <div style="align-self: flex-end;">
                    <button class="btn btn-primary btn-sm" id="applyFiltersBtn">Apply Filters</button>
                </div>
            </div>

            <!-- Audit Table -->
            <div class="glass-card">
                <div class="flex items-center justify-between mb-md">
                    <h3>Decision Records</h3>
                    <span class="text-sm text-muted" id="recordCount">—</span>
                </div>
                <div class="data-table-container" style="max-height: 600px; overflow-y: auto;">
                    <table class="data-table" id="auditTable">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Release</th>
                                <th>Organization</th>
                                <th>Version</th>
                                <th>Risk Score</th>
                                <th>Decision</th>
                                <th>Reasons</th>
                                <th>Reviewer</th>
                            </tr>
                        </thead>
                        <tbody id="auditBody">
                            <tr><td colspan="8"><div class="spinner"></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div class="offline-banner" id="offlineBanner">⚠️ <span>Offline — <span id="queueCount">0</span> events queued</span></div>

    <script src="js/offline-queue.js"></script>
    <script src="js/app.js"></script>
    <script>
        (async () => {
            await requireAuth();
            await loadUserInfo();
            await loadOrganizations();
            await loadAuditHistory();
        })();

        async function loadOrganizations() {
            try {
                const data = await API.get('/api/organizations');
                const select = document.getElementById('filterOrg');
                (data.organizations || []).forEach(org => {
                    const option = document.createElement('option');
                    option.value = org.name;
                    option.textContent = org.name;
                    select.appendChild(option);
                });
            } catch (err) {
                // Ignore - filter just won't have org options
            }
        }

        async function loadAuditHistory() {
            const params = new URLSearchParams();
            const from = document.getElementById('filterFrom').value;
            const to = document.getElementById('filterTo').value;
            const decision = document.getElementById('filterDecision').value;
            const org = document.getElementById('filterOrg').value;

            if (from) params.set('from', from);
            if (to) params.set('to', to);
            if (decision) params.set('decision', decision);
            if (org) params.set('org', org);

            try {
                const data = await API.get(`/api/audit?${params.toString()}`);
                renderAuditTable(data);
            } catch (err) {
                showToast('Failed to load audit history: ' + err.message, 'error');
                const tbody = document.getElementById('auditBody');
                tbody.innerHTML = `
                    <tr><td colspan="8">
                        <div class="empty-state">
                            <div class="empty-icon">🔒</div>
                            <p>Access denied or no audit records available.</p>
                            <p class="text-xs text-muted mt-sm">Only Compliance Officers and Auditors can view this page.</p>
                        </div>
                    </td></tr>`;
            }
        }

        function renderAuditTable(data) {
            const records = data.audit_records || [];
            document.getElementById('recordCount').textContent = `${data.total_count || 0} records`;

            const tbody = document.getElementById('auditBody');

            if (records.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="8">
                        <div class="empty-state">
                            <div class="empty-icon">📋</div>
                            <p>No audit records match your filters.</p>
                        </div>
                    </td></tr>`;
                return;
            }

            tbody.innerHTML = records.map(r => {
                const badgeClass = `badge-${r.decision.toLowerCase()}`;
                const time = r.decided_at ? new Date(r.decided_at).toLocaleString() : '—';
                const release = r.release_info || {};

                return `
                    <tr>
                        <td class="text-xs">${time}</td>
                        <td>
                            <a href="risk-detail.html?id=${release.release_id}" style="color: var(--color-text-link); text-decoration: none; font-weight: 600;">
                                ${release.release_id || '—'}
                            </a>
                        </td>
                        <td>${release.org_name || '—'}</td>
                        <td><code>${release.version || '—'}</code></td>
                        <td><strong>${r.risk_score}</strong></td>
                        <td><span class="badge ${badgeClass}"><span class="badge-dot"></span> ${r.decision}</span></td>
                        <td class="text-xs" style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${r.reasons || ''}">${r.reasons || '—'}</td>
                        <td class="text-xs text-muted">${r.reviewer || 'system'}</td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('applyFiltersBtn').addEventListener('click', loadAuditHistory);

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await API.post('/api/logout');
            window.location.href = '/';
        });
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('open');
        });
    </script>

</body>
</html>
